<text text-anchor="middle" x="346" y="-108.4" font-family="Courier New" font-size="12.00" fill="#ff0090">One CPU&#45;attached x16 slot, electrically split x8/x8 across two GPU slots.</text>
<text text-anchor="middle" x="346" y="-95.4" font-family="Courier New" font-size="12.00" fill="#ff0090">This is why OllamaVRAM evicts one model before loading another rather than</text>
<text text-anchor="middle" x="346" y="-82.4" font-family="Courier New" font-size="12.00" fill="#ff0090">keeping both simultaneously resident: the constraint here is shared CPU</text>
<text text-anchor="middle" x="346" y="-69.4" font-family="Courier New" font-size="12.00" fill="#ff0090">lane bandwidth, not just combined VRAM capacity. A datacenter board with</text>
<text text-anchor="middle" x="346" y="-56.4" font-family="Courier New" font-size="12.00" fill="#ff0090">NVLink or per&#45;GPU x16 wouldn&#39;t have this limitation — this one does,</text>
<text text-anchor="middle" x="346" y="-43.4" font-family="Courier New" font-size="12.00" fill="#ff0090">because it&#39;s a consumer AM4 desktop, not a server chassis.</text>
</g>
